<mat-nav-list>
  @for (todo of todoService.todos$ | async; track todo) {
    <a
      mat-list-item
      href="#{{ todo.id }}"
      (click)="onTodoSelect($event, todo)"
      [activated]="activeTodo === todo"
      [class.completed]="todo.isCompleted"
      >{{ todo.title| titlecase }}</a
    >
  }
</mat-nav-list>
