<mat-card class="card" appearance="outlined">
  @let todo = todo$ | async;
  <mat-card-header>
    <mat-card-title>{{ todo?.title }}</mat-card-title>
    <mat-card-subtitle>{{ todo?.description }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-actions>
    <button matButton (click)="onComplete()">Complete</button>
    <button matButton (click)="onArchive()">Archive</button>
  </mat-card-actions>
</mat-card>
